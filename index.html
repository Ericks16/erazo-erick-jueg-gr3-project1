<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego 2D con Phaser 3</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0e18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }

    #game {
      width: 800px;
      height: 600px;
      line-height: 0;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    #game canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
