<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Neon Drift: arcade de supervivencia cyberpunk hecho con Phaser 3." />
  <title>Neon Drift · Juego 2D con Phaser 3</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0e18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }

    #game {
      position: relative;
      width: min(800px, 100vw);
      height: min(600px, 100vh);
      line-height: 0;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      user-select: none;
      touch-action: none;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
